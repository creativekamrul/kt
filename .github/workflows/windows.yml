name: Windows game
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build, test and check local saves
        run: .\setup.cmd -Quick
      - name: Package the game and source
        run: .\kt.cmd package
      - name: Test the single-file game outside the checkout
        run: .\.venv\Scripts\python.exe tools/test_standalone.py out/KT.exe
      - uses: actions/upload-artifact@v4
        with:
          name: KT-windows-release
          path: |
            out/KT.exe
            out/KT-*-Windows-x64.zip
            out/KT-*-Source.zip
            out/KT-*-SHA256.txt
          if-no-files-found: error
