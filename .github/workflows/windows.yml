name: Windows game
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing release tag to rebuild
        required: false
        type: string
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    # Compile for the Windows x64 baseline even when the runner supports AVX-512.
    env:
      CFLAGS: "-target x86_64-windows-gnu -mcpu=baseline"
      CXXFLAGS: "-target x86_64-windows-gnu -mcpu=baseline"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build, test and check local saves
        run: .\setup.cmd -Quick
      - name: Package the game and source
        run: .\kt.cmd package
      - name: Test the single-file game outside the checkout
        run: .\.venv\Scripts\python.exe tools/test_standalone.py out/KT.exe
      - name: Build the Windows installer
        if: hashFiles('tools/build-installer.ps1') != ''
        run: .\tools\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KT-windows-release
          path: |
            out/KT.exe
            out/KT-Setup.exe
            out/KT-*-Windows-x64.zip
            out/KT-*-Source.zip
            out/KT-*-SHA256.txt
          if-no-files-found: error
